# =============================================================================
#  vsftpd — Estudio Pixel Verde (Grupo Nodos)
#  Dueño: Orlando (Integrante 4 — FTP y respaldos)
#
#  Se copia a /etc/vsftpd.conf (ver servidor/vsftpd/PASOS.md).
#  Es el vsftpd.conf de fábrica de Ubuntu (paquete vsftpd 3.0.5) sin los
#  comentarios, más los cambios del proyecto marcados abajo.
# =============================================================================

# --- Valores de fábrica de Ubuntu (sin cambios) -------------------------------
listen=NO
listen_ipv6=YES
anonymous_enable=NO
local_enable=YES
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
ssl_enable=NO

# --- Cambios de Pixel Verde ---------------------------------------------------

# Permite subir archivos (de fábrica el FTP es solo lectura).
write_enable=YES

# Lo que se sube queda rw-r--r--: los demás lo leen pero no lo modifican.
# El sticky bit de la carpeta impide borrar/renombrar; esto impide sobrescribir.
local_umask=022

# Encierra a cada usuario en local_root: no puede ver el resto del sistema.
# La raíz del encierro es de root y NO se puede escribir (por eso no se usa
# allow_writeable_chroot=YES).
chroot_local_user=YES
local_root=/srv/ftp/pixelverde

# Lista blanca: solo los usuarios de /etc/vsftpd.userlist pueden entrar.
# Las cuentas de administración (con sudo) quedan fuera: FTP manda la clave sin cifrar.
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

# Rango fijo para el modo pasivo (documentado y fácil de abrir en un firewall).
pasv_min_port=40000
pasv_max_port=40100

# Muestra nombres de usuario en vez de UID en los listados (más clara la evidencia).
text_userdb_names=YES
