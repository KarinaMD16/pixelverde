# =============================================================================
#  VirtualHost del puerto 443: HTTPS con certificado autofirmado y proxy inverso
#  hacia el contenedor TYPO3 (127.0.0.1:8080).
#  Se copia a /etc/apache2/sites-available/pixelverde-ssl.conf
#
#  El certificado y la llave NO están en Git: se generan en el servidor
#  (ver PASOS.md). Módulos: ssl proxy proxy_http headers.
# =============================================================================
<VirtualHost *:443>
    ServerName pixelverde.internal

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/pixelverde.crt
    SSLCertificateKeyFile /etc/ssl/private/pixelverde.key

    # Proxy inverso hacia el contenedor (solo escucha en 127.0.0.1)
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Le avisa a TYPO3 que el visitante entró por HTTPS
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/pixelverde-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/pixelverde-ssl-access.log combined
</VirtualHost>
