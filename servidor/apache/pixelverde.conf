# =============================================================================
#  VirtualHost del puerto 80: solo redirige a HTTPS.
#  Se copia a /etc/apache2/sites-available/pixelverde.conf
# =============================================================================
<VirtualHost *:80>
    ServerName pixelverde.internal

    Redirect permanent / https://pixelverde.internal/

    ErrorLog  ${APACHE_LOG_DIR}/pixelverde-error.log
    CustomLog ${APACHE_LOG_DIR}/pixelverde-access.log combined
</VirtualHost>
