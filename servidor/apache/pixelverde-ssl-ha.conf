# =============================================================================
#  BONO — Alta disponibilidad. Reemplaza a pixelverde-ssl.conf mientras el
#  bono está activo (no se usan los dos a la vez: los dos atienden el 443).
#
#  Mismo HTTPS que pixelverde-ssl.conf, pero en vez de mandar todo a un solo
#  contenedor (127.0.0.1:8080), Apache reparte las visitas entre dos:
#     typo3   → 127.0.0.1:8080  (route=1)
#     typo3-2 → 127.0.0.1:8081  (route=2)
#  Si uno no responde, Apache lo marca caído y manda todo al otro.
#
#  Se copia a /etc/apache2/sites-available/pixelverde-ssl-ha.conf
#  Módulos: ssl proxy proxy_http proxy_balancer lbmethod_byrequests headers
# =============================================================================
<VirtualHost *:443>
    ServerName pixelverde.internal

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/pixelverde.crt
    SSLCertificateKeyFile /etc/ssl/private/pixelverde.key

    # Grupo de dos contenedores. retry=10: un contenedor caído se vuelve a
    # probar a los 10 segundos; cuando vuelve, entra solo al reparto.
    <Proxy "balancer://typo3">
        BalancerMember "http://127.0.0.1:8080" route=1 retry=10 connectiontimeout=3
        BalancerMember "http://127.0.0.1:8081" route=2 retry=10 connectiontimeout=3
        ProxySet lbmethod=byrequests
    </Proxy>

    # Página de estado del balanceador (solo desde el servidor y la Red interna)
    <Location "/balancer-manager">
        SetHandler balancer-manager
        Require ip 127.0.0.1 192.168.50.0/24
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /balancer-manager !
    ProxyPass        / balancer://typo3/
    ProxyPassReverse / balancer://typo3/

    # Le avisa a TYPO3 que el visitante entró por HTTPS
    RequestHeader set X-Forwarded-Proto "https"

    # Para la demo: cada respuesta dice qué contenedor la atendió (1 o 2)
    Header always set X-Servido-Por "%{BALANCER_WORKER_ROUTE}e"

    ErrorLog  ${APACHE_LOG_DIR}/pixelverde-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/pixelverde-ssl-access.log combined
</VirtualHost>
