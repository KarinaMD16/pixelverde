; Valores recomendados por TYPO3 (System requirements, documentación oficial)
memory_limit = 256M
max_execution_time = 240
max_input_vars = 1500
pcre.jit = 1

; Subida de imágenes del portafolio desde el backend
post_max_size = 10M
upload_max_filesize = 10M

; Zona horaria del estudio
date.timezone = America/Costa_Rica

; Rendimiento
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
