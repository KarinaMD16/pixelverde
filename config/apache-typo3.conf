# Apache DENTRO del contenedor (no confundir con el Apache del servidor).
# TYPO3 trae su propio .htaccess (URLs amigables y reglas de seguridad),
# así que hay que permitir que lo use.
<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Evita el aviso "Could not reliably determine the server's fully qualified domain name"
ServerName pixelverde-typo3
